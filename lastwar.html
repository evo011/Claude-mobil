<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fc4e8">
<title>Last Tap: Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #8fc4e8;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #back {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 16px;
    z-index: 5;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    padding: 8px;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 16px);
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    color: white;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }
  #meters {
    font-size: 34px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  #kills {
    font-size: 15px;
    font-weight: 700;
    opacity: 0.9;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 20px;
  }
  .panel {
    pointer-events: auto;
    background: rgba(30,32,24,0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;
    padding: 32px 36px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    max-width: 330px;
  }
  .panel h1 {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 10px;
  }
  .panel p {
    font-size: 16px;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 22px;
    line-height: 1.45;
  }
  .stats {
    display: flex;
    gap: 22px;
    justify-content: center;
    margin: 4px 0 22px;
  }
  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .stat .value {
    font-size: 30px;
    font-weight: 900;
  }
  .record { color: #ffd64d; font-weight: 800; margin-bottom: 18px; }
  button {
    background: #ffd64d;
    border: none;
    color: #533;
    font-size: 18px;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 20px;
    box-shadow: 0 4px 0 #c9a030, 0 6px 16px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    font-family: inherit;
  }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c9a030, 0 2px 8px rgba(0,0,0,0.3);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">‹ Arcade</a>
<div id="hud" class="hidden">
  <div id="meters">0 m</div>
  <div id="kills">☠️ 0</div>
</div>
<div id="ui">
  <div id="start" class="panel">
    <h1>🪖 Last Tap: Survival</h1>
    <p>Zieh deine Squad mit dem Finger nach links und rechts. Nimm die <b>grünen Tore</b> (+/×) mit, meide die roten — und halte die Zombie-Horde auf!</p>
    <button id="startBtn">Ausrücken</button>
  </div>
  <div id="over" class="panel hidden">
    <h1>💀 Überrannt!</h1>
    <div class="stats">
      <div class="stat"><div class="label">Distanz</div><div class="value" id="finalMeters">0</div></div>
      <div class="stat"><div class="label">Kills</div><div class="value" id="finalKills">0</div></div>
    </div>
    <div class="record" id="recordLine"></div>
    <button id="retryBtn">Neuer Versuch</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const metersEl = document.getElementById('meters');
  const killsEl = document.getElementById('kills');
  const startPanel = document.getElementById('start');
  const overPanel = document.getElementById('over');
  const finalMeters = document.getElementById('finalMeters');
  const finalKills = document.getElementById('finalKills');
  const recordLine = document.getElementById('recordLine');

  let W = 0, H = 0, DPR = 1;
  const GOLD = Math.PI * (3 - Math.sqrt(5));

  // ---------- Welt & Projektion ----------
  // Weltkoordinaten: wx in [-1, 1] (Straßenbreite), z in [0 (Spieler) .. 1 (Horizont)].
  // Pseudo-3D: Perspektivfaktor pf(z) skaliert Breite, Höhe und Objektgröße.
  const D = 5;
  const pf = (z) => 1 / (1 + D * z);
  const P_FAR = pf(1);
  const horizonY = () => H * 0.30;
  const bottomY = () => H * 0.84;
  const rh = (z) => W * 0.46 * pf(z);                 // halbe Straßenbreite auf Screen
  const sy = (z) => horizonY() + (bottomY() - horizonY()) * (pf(z) - P_FAR) / (1 - P_FAR);
  const sx = (wx, z) => W / 2 + wx * rh(z);

  const S = {
    mode: 'menu', // menu | playing | over
    wx: 0,
    count: 1,
    meters: 0,
    kills: 0,
    speed: 0.17, // z-Einheiten pro Sekunde
    gates: [],
    zombies: [],
    bullets: [],
    particles: [],
    texts: [],
    fireAcc: 0,
    nextGateAt: 30,
    nextWaveAt: 14,
    bossAt: 400,
    stripeOff: 0,
    propOff: 0,
    pulse: 0,
    flash: 0,
    shake: 0,
    last: 0,
    best: +(localStorage.getItem('lastwar_best') || 0),
  };
  window.__lw = S; // Debug-/Test-Hook

  const squadWR = () => 0.05 + 0.016 * Math.sqrt(Math.min(S.count, 50));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function reset() {
    S.wx = 0;
    S.count = 5;
    S.meters = 0;
    S.kills = 0;
    S.speed = 0.17;
    S.gates = [];
    S.zombies = [];
    S.bullets = [];
    S.particles = [];
    S.texts = [];
    S.fireAcc = 0;
    S.nextGateAt = 6;
    S.nextWaveAt = 50;
    S.bossAt = 400;
    S.pulse = 0;
    S.flash = 0;
    S.shake = 0;
    metersEl.textContent = '0 m';
    killsEl.textContent = '☠️ 0';
  }

  function startGame() {
    reset();
    S.mode = 'playing';
    startPanel.classList.add('hidden');
    overPanel.classList.add('hidden');
    hud.classList.remove('hidden');
  }

  function gameOver() {
    S.mode = 'over';
    S.flash = 1;
    S.shake = 10;
    burstAt(sx(S.wx, 0), bottomY(), '#4d79ff', 32);
    navigator.vibrate && navigator.vibrate([80, 50, 120]);
    const score = Math.floor(S.meters);
    let rec;
    if (score > S.best) {
      S.best = score;
      localStorage.setItem('lastwar_best', score);
      rec = '🏆 Neuer Rekord!';
    } else {
      rec = '🏆 Rekord: ' + S.best + ' m';
    }
    setTimeout(() => {
      finalMeters.textContent = score + ' m';
      finalKills.textContent = S.kills;
      recordLine.textContent = rec;
      hud.classList.add('hidden');
      overPanel.classList.remove('hidden');
    }, 700);
  }

  // ---------- Spawning ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }

  function goodOp() {
    if (Math.random() < 0.22) return { op: 'x', val: Math.random() < 0.2 ? 3 : 2 };
    return { op: '+', val: ri(3, 8 + Math.floor(S.meters / 25)) };
  }
  function badOp() {
    if (Math.random() < 0.3) return { op: '÷', val: 2 };
    return { op: '-', val: ri(4, 8 + Math.floor(S.meters / 35)) };
  }

  function spawnGate() {
    const a = goodOp();
    // Am Anfang sind beide Seiten gut, damit die Squad erst mal wachsen kann
    const b = S.meters < 90 || Math.random() >= 0.65 ? goodOp() : badOp();
    const flip = Math.random() < 0.5;
    S.gates.push({ z: 1, left: flip ? b : a, right: flip ? a : b, used: false });
  }

  function spawnWave(big) {
    const n = Math.min(30, ri(3, 5) + Math.floor(S.meters / 55)) * (big ? 2 : 1);
    const cwx = rnd(-0.5, 0.5);
    const hp = 1 + Math.floor(S.meters / 180);
    for (let i = 0; i < n; i++) {
      S.zombies.push({
        wx: Math.min(Math.max(cwx + rnd(-0.45, 0.45), -0.92), 0.92),
        z: rnd(1.0, 1.45),
        wr: 0.055,
        hp, maxHp: hp,
        vz: rnd(0.012, 0.05),
        wob: Math.random() * Math.PI * 2,
        boss: false,
      });
    }
  }

  function spawnBoss() {
    const hp = 25 + Math.floor(S.meters / 8);
    S.zombies.push({
      wx: rnd(-0.4, 0.4), z: 1.2, wr: 0.16,
      hp, maxHp: hp, vz: 0.008, wob: 0, boss: true,
    });
  }

  function burstAt(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, size: 2 + Math.random() * 4 });
    }
  }

  function floatText(x, y, txt, color, big) {
    S.texts.push({ x, y, txt, color, life: 1, big: !!big });
  }

  // ---------- Gameplay ----------
  function applyGate(side) {
    const c0 = S.count;
    if (side.op === '+') S.count += side.val;
    if (side.op === '-') S.count -= side.val;
    if (side.op === 'x') S.count *= side.val;
    if (side.op === '÷') S.count = Math.ceil(S.count / side.val);
    S.count = Math.min(S.count, 999);
    const diff = S.count - c0;
    const good = diff >= 0;
    S.pulse = 1;
    floatText(sx(S.wx, 0), bottomY() - 130, (good ? '+' : '') + diff + ' Soldaten', good ? '#5dff8a' : '#ff6b6b', true);
    burstAt(sx(S.wx, 0), bottomY() - 30, good ? '#5dff8a' : '#ff6b6b', 16);
    navigator.vibrate && navigator.vibrate(good ? 15 : [40, 30, 40]);
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  function hitSquad(z) {
    const dmg = z.boss ? 8 + Math.ceil(z.hp / 4) : 1;
    S.count -= dmg;
    S.flash = Math.min(1, S.flash + (z.boss ? 0.8 : 0.35));
    S.shake = Math.max(S.shake, z.boss ? 9 : 4);
    floatText(sx(z.wx, 0.02), sy(0.02) - 40, '-' + dmg, '#ff6b6b', z.boss);
    burstAt(sx(z.wx, 0.02), sy(0.02), '#ff6b6b', z.boss ? 20 : 7);
    navigator.vibrate && navigator.vibrate(z.boss ? [60, 40, 60] : 25);
    z.hp = 0;
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  function update(dt) {
    stepFx();
    if (S.mode !== 'playing') return;

    const ds = dt / 1000;
    S.speed = Math.min(0.32, 0.17 + S.meters / 2600);
    S.meters += S.speed * ds * 55;
    metersEl.textContent = Math.floor(S.meters) + ' m';

    S.stripeOff = (S.stripeOff + S.speed * ds) % 0.09;
    S.propOff = (S.propOff + S.speed * ds) % 0.15;

    // Spawns (distanzbasiert)
    if (S.meters >= S.nextGateAt) {
      spawnGate();
      S.nextGateAt = S.meters + rnd(42, 62);
    }
    if (S.meters >= S.nextWaveAt) {
      spawnWave(Math.random() < 0.18);
      S.nextWaveAt = S.meters + rnd(16, 28);
    }
    if (S.meters >= S.bossAt) {
      spawnBoss();
      S.bossAt += 400;
    }

    // Auto-Feuer: Rate wächst mit der Squad
    const rate = Math.min(26, 3.5 + S.count * 0.45);
    S.fireAcc += dt;
    const interval = 1000 / rate;
    while (S.fireAcc >= interval) {
      S.fireAcc -= interval;
      S.bullets.push({ wx: S.wx + rnd(-0.7, 0.7) * squadWR(), z: 0.04 });
      S.particles.push({ x: sx(S.wx, 0) + rnd(-20, 20), y: bottomY() - 38, vx: rnd(-0.5, 0.5), vy: -1.5, life: 0.35, color: '#ffe08a', size: 3 });
      if (S.bullets.length > 200) S.bullets.shift();
    }
    for (const b of S.bullets) b.z += 1.9 * ds;
    S.bullets = S.bullets.filter((b) => b.z < 1.5);

    // Tore
    for (const g of S.gates) {
      g.z -= S.speed * ds;
      if (!g.used && g.z <= 0.02) {
        g.used = true;
        applyGate(S.wx < 0 ? g.left : g.right);
        if (S.mode !== 'playing') return;
      }
    }
    S.gates = S.gates.filter((g) => g.z > -0.2);

    // Zombies
    for (const z of S.zombies) {
      z.z -= (S.speed + z.vz) * ds;
      z.wob += ds * 7;
      if (z.z < 0.35 && z.z > 0) {
        z.wx += Math.sign(S.wx - z.wx) * 0.22 * ds;
      }
      if (z.hp > 0 && z.z <= 0.02 && z.z > -0.06 && Math.abs(z.wx - S.wx) < z.wr + squadWR()) {
        hitSquad(z);
        if (S.mode !== 'playing') return;
      }
    }

    // Treffer
    for (const b of S.bullets) {
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.z > 1) continue;
        if (Math.abs(b.wx - z.wx) < z.wr * 1.35 && Math.abs(b.z - z.z) < 0.04) {
          z.hp--;
          b.z = 99;
          if (z.hp <= 0) {
            S.kills++;
            killsEl.textContent = '☠️ ' + S.kills;
            burstAt(sx(z.wx, z.z), sy(z.z), z.boss ? '#c06bff' : '#ff5252', z.boss ? 26 : 7);
            if (z.boss) {
              floatText(sx(z.wx, z.z), sy(z.z) - 30, 'BOSS DOWN!', '#ffd64d', true);
              S.shake = Math.max(S.shake, 8);
              navigator.vibrate && navigator.vibrate([30, 40, 60]);
            }
          } else {
            S.particles.push({ x: sx(z.wx, z.z), y: sy(z.z) - 10, vx: rnd(-1, 1), vy: -1, life: 0.5, color: '#ffe08a', size: 2.5 });
          }
          break;
        }
      }
    }
    S.zombies = S.zombies.filter((z) => z.hp > 0 && z.z > -0.3);
  }

  function stepFx() {
    for (const p of S.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.035; }
    S.particles = S.particles.filter((p) => p.life > 0);
    for (const t of S.texts) { t.y -= 1.1; t.life -= 0.014; }
    S.texts = S.texts.filter((t) => t.life > 0);
    S.pulse *= 0.93;
    S.flash *= 0.92;
    S.shake *= 0.88;
  }

  // ---------- Rendering ----------
  let cloudT = 0;

  function draw() {
    ctx.save();
    if (S.shake > 0.4) ctx.translate(rnd(-1, 1) * S.shake, rnd(-1, 1) * S.shake);

    drawSky();
    drawGround();
    drawRoad();

    // Entities von fern nach nah
    const ents = [];
    for (const g of S.gates) if (g.z <= 1) ents.push({ z: g.z, kind: 'gate', o: g });
    for (const z of S.zombies) if (z.z <= 1) ents.push({ z: z.z, kind: 'zombie', o: z });
    ents.sort((a, b) => b.z - a.z);
    for (const e of ents) {
      if (e.kind === 'gate') drawGate(e.o);
      else drawZombie(e.o);
    }

    // Tracer
    for (const b of S.bullets) {
      if (b.z > 1) continue;
      const p = pf(b.z);
      ctx.strokeStyle = 'rgba(255,230,130,0.95)';
      ctx.lineWidth = Math.max(1.5, 3.5 * p);
      ctx.beginPath();
      ctx.moveTo(sx(b.wx, b.z), sy(b.z));
      ctx.lineTo(sx(b.wx, b.z + 0.03), sy(b.z + 0.03));
      ctx.stroke();
    }

    if (S.mode !== 'menu') drawSquad();

    // Partikel
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating-Texte
    ctx.textAlign = 'center';
    for (const t of S.texts) {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.font = '900 ' + (t.big ? 34 : 26) + 'px -apple-system, sans-serif';
      ctx.fillStyle = t.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 5;
      ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Treffer-Flash
    if (S.flash > 0.02) {
      ctx.fillStyle = 'rgba(255,40,40,' + (0.3 * S.flash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawSky() {
    const hy = horizonY();
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, '#6fb6e8');
    g.addColorStop(1, '#cfe9f4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hy + 2);
    // Sonne
    const sgx = W * 0.78, sgy = H * 0.10;
    const rg = ctx.createRadialGradient(sgx, sgy, 4, sgx, sgy, 70);
    rg.addColorStop(0, 'rgba(255,245,200,0.95)');
    rg.addColorStop(0.35, 'rgba(255,240,180,0.5)');
    rg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(sgx - 70, sgy - 70, 140, 140);
    // Wolken
    cloudT += 0.0004;
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 0.4 + 0.1 + (cloudT * (0.5 + i * 0.3)) % 1) % 1.2 - 0.1) * W;
      const cy = hy * (0.25 + i * 0.22);
      ctx.beginPath();
      ctx.ellipse(cx, cy, 36, 11, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 24, cy - 7, 24, 9, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - 22, cy - 5, 20, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGround() {
    const hy = horizonY();
    const g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, '#cbbf96');
    g.addColorStop(1, '#dfd4ae');
    ctx.fillStyle = g;
    ctx.fillRect(0, hy, W, H - hy);
    // ferne Dünen
    ctx.fillStyle = '#d6caa1';
    ctx.beginPath();
    ctx.ellipse(W * 0.18, hy + 6, W * 0.3, 14, 0, 0, Math.PI * 2);
    ctx.ellipse(W * 0.85, hy + 9, W * 0.35, 18, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function pathAlongRoad(wxA, wxB) {
    // Quad-Streifen entlang der Straße von nah (z=-0.08) bis Horizont
    const steps = 10;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const z = -0.08 + (1.08 * i) / steps;
      const x = sx(wxA, z), y = sy(z);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const z = -0.08 + (1.08 * i) / steps;
      ctx.lineTo(sx(wxB, z), sy(z));
    }
    ctx.closePath();
  }

  function drawRoad() {
    // Asphalt
    const g = ctx.createLinearGradient(0, horizonY(), 0, bottomY());
    g.addColorStop(0, '#9d8f72');
    g.addColorStop(1, '#b2a37f');
    ctx.fillStyle = g;
    pathAlongRoad(-1, 1);
    ctx.fill();
    // Randlinien
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    pathAlongRoad(-1.0, -0.955);
    ctx.fill();
    pathAlongRoad(0.955, 1.0);
    ctx.fill();
    // Mittelstreifen (scrollend)
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let z0 = -S.stripeOff; z0 < 1; z0 += 0.09) {
      const z1 = z0, z2 = z0 + 0.04;
      if (z2 < -0.06) continue;
      ctx.beginPath();
      ctx.moveTo(sx(-0.02, z1), sy(z1));
      ctx.lineTo(sx(0.02, z1), sy(z1));
      ctx.lineTo(sx(0.018, z2), sy(z2));
      ctx.lineTo(sx(-0.018, z2), sy(z2));
      ctx.closePath();
      ctx.fill();
    }
    // Deko am Straßenrand (scrollend): Felsen / Büsche
    for (let i = 0; i < 8; i++) {
      const z = ((i * 0.15 - S.propOff) % 1.2 + 1.2) % 1.2 - 0.05;
      if (z > 1 || z < -0.05) continue;
      const p = pf(z);
      const side = i % 2 === 0 ? -1.22 : 1.22;
      ctx.fillStyle = i % 4 < 2 ? '#8a7c5a' : '#6e7d4a';
      ctx.beginPath();
      ctx.ellipse(sx(side, z), sy(z) - 4 * p, 12 * p, 8 * p, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function gateLabel(s) {
    if (s.op === 'x') return '×' + s.val;
    if (s.op === '÷') return '÷' + s.val;
    return (s.op === '+' ? '+' : '−') + s.val;
  }
  const gateGood = (s) => s.op === '+' || s.op === 'x';

  function drawGate(gt) {
    const p = pf(gt.z);
    const y = sy(gt.z);
    const gh = 120 * p;
    const halves = [
      { s: gt.left, a: -1, b: 0 },
      { s: gt.right, a: 0, b: 1 },
    ];
    for (const { s, a, b } of halves) {
      const x1 = sx(a, gt.z), x2 = sx(b, gt.z);
      const good = gateGood(s);
      const alpha = gt.used ? 0.18 : 0.66;
      const grad = ctx.createLinearGradient(0, y - gh, 0, y);
      if (good) {
        grad.addColorStop(0, 'rgba(70,220,130,' + alpha * 0.55 + ')');
        grad.addColorStop(1, 'rgba(20,160,80,' + alpha + ')');
      } else {
        grad.addColorStop(0, 'rgba(255,90,80,' + alpha * 0.55 + ')');
        grad.addColorStop(1, 'rgba(190,30,30,' + alpha + ')');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(x1 + 3 * p, y - gh, x2 - x1 - 6 * p, gh);
      // Rahmen + Pfosten
      ctx.fillStyle = gt.used ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.85)';
      ctx.fillRect(x1, y - gh, 5 * p, gh);
      ctx.fillRect(x2 - 5 * p, y - gh, 5 * p, gh);
      ctx.fillRect(x1, y - gh - 4 * p, x2 - x1, 5 * p);
      // Label
      ctx.globalAlpha = gt.used ? 0.35 : 1;
      ctx.font = '900 ' + Math.max(13, 46 * p) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = Math.max(2, 6 * p);
      ctx.strokeText(gateLabel(s), (x1 + x2) / 2, y - gh / 2);
      ctx.fillStyle = 'white';
      ctx.fillText(gateLabel(s), (x1 + x2) / 2, y - gh / 2);
      ctx.globalAlpha = 1;
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawZombie(z) {
    const p = pf(z.z);
    const x = sx(z.wx, z.z);
    const y = sy(z.z);
    const sc = (z.boss ? 2.6 : 1) * p;
    const lean = Math.sin(z.wob) * 3 * sc;
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y, 14 * sc, 5 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    // Arme (nach vorn gestreckt, schwingend)
    ctx.strokeStyle = z.boss ? '#6e2da0' : '#a82626';
    ctx.lineWidth = 3.5 * sc;
    const swing = Math.sin(z.wob * 2) * 4 * sc;
    ctx.beginPath();
    ctx.moveTo(x - 8 * sc, y - 16 * sc);
    ctx.lineTo(x - 13 * sc, y - 8 * sc + swing);
    ctx.moveTo(x + 8 * sc, y - 16 * sc);
    ctx.lineTo(x + 13 * sc, y - 8 * sc - swing);
    ctx.stroke();
    // Körper
    ctx.fillStyle = z.boss ? '#8a3fc4' : '#d23c3c';
    ctx.strokeStyle = z.boss ? '#5e2687' : '#8f1d1d';
    ctx.lineWidth = 2 * sc;
    ctx.beginPath();
    ctx.ellipse(x + lean * 0.3, y - 12 * sc, 9 * sc, 12 * sc, lean * 0.02, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Kopf
    ctx.fillStyle = z.boss ? '#7a35ad' : '#b92f2f';
    ctx.beginPath();
    ctx.arc(x + lean * 0.5, y - 27 * sc, 5.5 * sc, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Augen
    ctx.fillStyle = '#ffe9a8';
    ctx.beginPath();
    ctx.arc(x + lean * 0.5 - 2 * sc, y - 28 * sc, 1.3 * sc, 0, Math.PI * 2);
    ctx.arc(x + lean * 0.5 + 2 * sc, y - 28 * sc, 1.3 * sc, 0, Math.PI * 2);
    ctx.fill();
    // Boss-HP
    if (z.boss) {
      const w = 60 * sc;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(x - w / 2, y - 42 * sc, w, 6 * sc);
      ctx.fillStyle = '#7dff7d';
      ctx.fillRect(x - w / 2, y - 42 * sc, w * (z.hp / z.maxHp), 6 * sc);
    }
  }

  // Formation: goldener Spiral-Offset, hinten zuerst gezeichnet
  const formation = [];
  for (let i = 0; i < 50; i++) {
    const r = 6.4 * Math.sqrt(i);
    const a = i * GOLD;
    formation.push({ ox: Math.cos(a) * r, oy: Math.sin(a) * r * 0.62 });
  }
  const formationOrder = formation.map((_, i) => i).sort((a, b) => formation[a].oy - formation[b].oy);

  function drawSoldier(x, y, t, i) {
    const step = Math.sin(t / 90 + i * 1.7) * 1.6;
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 7, 7, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Beine
    ctx.strokeStyle = '#26407a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 2.5, y);
    ctx.lineTo(x - 2.5, y + 6 + step * 0.5);
    ctx.moveTo(x + 2.5, y);
    ctx.lineTo(x + 2.5, y + 6 - step * 0.5);
    ctx.stroke();
    // Körper
    ctx.fillStyle = '#3b6fe0';
    ctx.strokeStyle = '#1f3f8f';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y - 4 + step * 0.3, 5.2, 6.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Waffe (nach vorn / oben)
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 4, y - 6);
    ctx.lineTo(x + 6.5, y - 13);
    ctx.stroke();
    // Kopf + Helm
    ctx.fillStyle = '#f0c39a';
    ctx.beginPath();
    ctx.arc(x, y - 12 + step * 0.3, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#274a9e';
    ctx.beginPath();
    ctx.arc(x, y - 13 + step * 0.3, 3.6, Math.PI, 0);
    ctx.fill();
  }

  function drawSquad() {
    const cx = sx(S.wx, 0);
    const cy = bottomY() - 16;
    const t = performance.now();
    const n = Math.min(S.count, 50);
    const scale = 1 + 0.16 * S.pulse;
    for (const i of formationOrder) {
      if (i >= n) continue;
      const f = formation[i];
      drawSoldier(cx + f.ox * scale, cy + f.oy * scale, t, i);
    }
    // Truppenstärke
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(26 * scale) + 'px -apple-system, sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 6;
    const label = '' + S.count;
    const ly = cy - 58 - 6.4 * Math.sqrt(n) * 0.62;
    ctx.strokeText(label, cx, ly);
    ctx.fillStyle = 'white';
    ctx.fillText(label, cx, ly);
  }

  function loop(t) {
    const dt = Math.min(50, t - S.last);
    S.last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  let dragging = false, lastX = 0;
  function down(x) { dragging = true; lastX = x; }
  function move(x) {
    if (!dragging || S.mode !== 'playing') { lastX = x; return; }
    S.wx = Math.min(Math.max(S.wx + ((x - lastX) / rh(0)) * 1.5, -0.84), 0.84);
    lastX = x;
  }
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); down(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchend', () => { dragging = false; });
  canvas.addEventListener('mousedown', (e) => down(e.clientX));
  canvas.addEventListener('mousemove', (e) => move(e.clientX));
  canvas.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('keydown', (e) => {
    if (S.mode !== 'playing') return;
    if (e.code === 'ArrowLeft') S.wx = Math.max(-0.84, S.wx - 0.09);
    if (e.code === 'ArrowRight') S.wx = Math.min(0.84, S.wx + 0.09);
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  S.last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
