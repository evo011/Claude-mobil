<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#43484e">
<title>Last Tap: Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #43484e;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #back {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 16px;
    z-index: 5;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    padding: 8px;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 16px);
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    color: white;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }
  #meters {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  #kills {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 20px;
  }
  .panel {
    pointer-events: auto;
    background: rgba(18,20,18,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 32px 36px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-width: 330px;
  }
  .panel h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .panel p {
    font-size: 16px;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 22px;
    line-height: 1.45;
  }
  .stats {
    display: flex;
    gap: 22px;
    justify-content: center;
    margin: 4px 0 22px;
  }
  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .stat .value {
    font-size: 30px;
    font-weight: 900;
  }
  .record { color: #c9a35a; font-weight: 700; letter-spacing: 1px; margin-bottom: 18px; }
  button {
    background: #c9a35a;
    border: none;
    color: #1e1a10;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 32px;
    border-radius: 6px;
    box-shadow: 0 3px 0 #8a6e38, 0 6px 16px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    font-family: inherit;
  }
  button:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8a6e38, 0 2px 8px rgba(0,0,0,0.4);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">‹ Arcade</a>
<div id="hud" class="hidden">
  <div id="meters">0 m</div>
  <div id="kills">Kills 0</div>
</div>
<div id="ui">
  <div id="start" class="panel">
    <h1>Last Tap: Survival</h1>
    <p>Zieh deine Einheit mit dem Finger nach links und rechts. Grüne Tore verstärken die Truppe, rote schwächen sie. Halte die Horde auf.</p>
    <button id="startBtn">Einsatz starten</button>
  </div>
  <div id="over" class="panel hidden">
    <h1>Einheit gefallen</h1>
    <div class="stats">
      <div class="stat"><div class="label">Distanz</div><div class="value" id="finalMeters">0</div></div>
      <div class="stat"><div class="label">Kills</div><div class="value" id="finalKills">0</div></div>
    </div>
    <div class="record" id="recordLine"></div>
    <button id="retryBtn">Neuer Einsatz</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const metersEl = document.getElementById('meters');
  const killsEl = document.getElementById('kills');
  const startPanel = document.getElementById('start');
  const overPanel = document.getElementById('over');
  const finalMeters = document.getElementById('finalMeters');
  const finalKills = document.getElementById('finalKills');
  const recordLine = document.getElementById('recordLine');

  let W = 0, H = 0, DPR = 1;
  const GOLD = Math.PI * (3 - Math.sqrt(5));

  // ---------- Welt & Projektion ----------
  // Weltkoordinaten: wx in [-1, 1] (Straßenbreite), z in [0 (Spieler) .. 1 (Horizont)].
  // Pseudo-3D: Perspektivfaktor pf(z) skaliert Breite, Höhe und Objektgröße.
  const D = 5;
  const pf = (z) => 1 / (1 + D * z);
  const P_FAR = pf(1);
  const horizonY = () => H * 0.30;
  const bottomY = () => H * 0.84;
  const rh = (z) => W * 0.46 * pf(z);                 // halbe Straßenbreite auf Screen
  const sy = (z) => horizonY() + (bottomY() - horizonY()) * (pf(z) - P_FAR) / (1 - P_FAR);
  const sx = (wx, z) => W / 2 + wx * rh(z);

  const S = {
    mode: 'menu', // menu | playing | over
    wx: 0,
    count: 1,
    meters: 0,
    kills: 0,
    speed: 0.12, // z-Einheiten pro Sekunde
    volley: 0,
    gates: [],
    zombies: [],
    bullets: [],
    particles: [],
    texts: [],
    nextGateAt: 6,
    nextWaveAt: 40,
    bossAt: 400,
    stripeOff: 0,
    propOff: 0,
    pulse: 0,
    flash: 0,
    shake: 0,
    last: 0,
    best: +(localStorage.getItem('lastwar_best') || 0),
  };
  window.__lw = S; // Debug-/Test-Hook

  const squadWR = () => 0.05 + 0.016 * Math.sqrt(Math.min(S.count, 50));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function reset() {
    S.wx = 0;
    S.count = 5;
    S.meters = 0;
    S.kills = 0;
    S.speed = 0.12;
    S.volley = 0;
    S.gates = [];
    S.zombies = [];
    S.bullets = [];
    S.particles = [];
    S.texts = [];
    S.nextGateAt = 6;
    S.nextWaveAt = 40;
    S.bossAt = 400;
    S.pulse = 0;
    S.flash = 0;
    S.shake = 0;
    metersEl.textContent = '0 m';
    killsEl.textContent = 'Kills 0';
  }

  function startGame() {
    reset();
    S.mode = 'playing';
    startPanel.classList.add('hidden');
    overPanel.classList.add('hidden');
    hud.classList.remove('hidden');
  }

  function gameOver() {
    S.mode = 'over';
    S.flash = 1;
    S.shake = 10;
    burstAt(sx(S.wx, 0), bottomY(), '#5d7290', 30);
    navigator.vibrate && navigator.vibrate([80, 50, 120]);
    const score = Math.floor(S.meters);
    let rec;
    if (score > S.best) {
      S.best = score;
      localStorage.setItem('lastwar_best', score);
      rec = 'Neuer Rekord';
    } else {
      rec = 'Rekord: ' + S.best + ' m';
    }
    setTimeout(() => {
      finalMeters.textContent = score + ' m';
      finalKills.textContent = S.kills;
      recordLine.textContent = rec;
      hud.classList.add('hidden');
      overPanel.classList.remove('hidden');
    }, 700);
  }

  // ---------- Spawning ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }

  function goodOp() {
    if (Math.random() < 0.22) return { op: 'x', val: Math.random() < 0.2 ? 3 : 2 };
    return { op: '+', val: ri(3, 8 + Math.floor(S.meters / 25)) };
  }
  function badOp() {
    if (Math.random() < 0.3) return { op: '÷', val: 2 };
    return { op: '-', val: ri(4, 8 + Math.floor(S.meters / 35)) };
  }

  function spawnGate() {
    const a = goodOp();
    // Am Anfang sind beide Seiten gut, damit die Squad erst mal wachsen kann
    const b = S.meters < 90 || Math.random() >= 0.65 ? goodOp() : badOp();
    const flip = Math.random() < 0.5;
    S.gates.push({ z: 1, left: flip ? b : a, right: flip ? a : b, used: false });
  }

  function spawnWave(big) {
    const n = Math.min(22, ri(4, 6) + Math.floor(S.meters / 70)) * (big ? 2 : 1);
    const cwx = rnd(-0.5, 0.5);
    const hp = 2 + Math.floor(S.meters / 150);
    for (let i = 0; i < n; i++) {
      S.zombies.push({
        wx: Math.min(Math.max(cwx + rnd(-0.45, 0.45), -0.92), 0.92),
        z: rnd(1.0, 1.45),
        wr: 0.055,
        hp, maxHp: hp,
        vz: rnd(0.01, 0.03),
        wob: Math.random() * Math.PI * 2,
        atk: rnd(300, 900),
        boss: false,
      });
    }
  }

  function spawnBoss() {
    const hp = 30 + Math.floor(S.meters / 10);
    S.zombies.push({
      wx: rnd(-0.4, 0.4), z: 1.2, wr: 0.16,
      hp, maxHp: hp, vz: 0.006, wob: 0, atk: 600, boss: true,
    });
  }

  function burstAt(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, size: 2 + Math.random() * 4 });
    }
  }

  function floatText(x, y, txt, color, big) {
    S.texts.push({ x, y, txt, color, life: 1, big: !!big });
  }

  // ---------- Gameplay ----------
  function applyGate(side) {
    const c0 = S.count;
    if (side.op === '+') S.count += side.val;
    if (side.op === '-') S.count -= side.val;
    if (side.op === 'x') S.count *= side.val;
    if (side.op === '÷') S.count = Math.ceil(S.count / side.val);
    S.count = Math.min(S.count, 999);
    const diff = S.count - c0;
    const good = diff >= 0;
    S.pulse = 1;
    floatText(sx(S.wx, 0), bottomY() - 130, (good ? '+' : '') + diff + ' Soldaten', good ? '#a8d98a' : '#e05d50', true);
    burstAt(sx(S.wx, 0), bottomY() - 30, good ? '#a8d98a' : '#e05d50', 14);
    navigator.vibrate && navigator.vibrate(good ? 15 : [40, 30, 40]);
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  // Ein Zombie an der Frontlinie beißt zu — er stirbt dabei NICHT,
  // sondern bleibt stehen, bis er erschossen wird.
  function biteSquad(z) {
    const dmg = z.boss ? 5 : 1;
    S.count -= dmg;
    S.flash = Math.min(1, S.flash + (z.boss ? 0.6 : 0.25));
    S.shake = Math.max(S.shake, z.boss ? 7 : 3);
    floatText(sx(z.wx, 0.06), sy(0.06) - 40, '-' + dmg, '#e05d50', z.boss);
    burstAt(sx(z.wx, 0.06), sy(0.06), '#8a2f22', z.boss ? 14 : 5);
    navigator.vibrate && navigator.vibrate(z.boss ? [60, 40, 60] : 20);
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  function update(dt) {
    stepFx();
    if (S.mode !== 'playing') return;

    const ds = dt / 1000;
    S.speed = Math.min(0.2, 0.12 + S.meters / 3500);
    S.meters += S.speed * ds * 55;
    metersEl.textContent = Math.floor(S.meters) + ' m';

    S.stripeOff = (S.stripeOff + S.speed * ds) % 0.09;
    S.propOff = (S.propOff + S.speed * ds) % 0.15;

    // Spawns (distanzbasiert)
    if (S.meters >= S.nextGateAt) {
      spawnGate();
      S.nextGateAt = S.meters + rnd(42, 62);
    }
    if (S.meters >= S.nextWaveAt) {
      spawnWave(Math.random() < 0.18);
      S.nextWaveAt = S.meters + rnd(26, 40);
    }
    if (S.meters >= S.bossAt) {
      spawnBoss();
      S.bossAt += 400;
    }

    // Salvenfeuer: jeder Soldat gibt parallel einen Schuss ab
    S.volley -= dt;
    if (S.volley <= 0) {
      S.volley = 650;
      const n = Math.min(S.count, 50);
      for (let i = 0; i < n; i++) {
        const f = formation[i];
        S.bullets.push({ wx: S.wx + f.ox / rh(0) + rnd(-0.012, 0.012), z: 0.05 });
      }
      for (let i = 0; i < Math.min(n, 10); i++) {
        S.particles.push({ x: sx(S.wx, 0) + rnd(-32, 32), y: bottomY() - rnd(28, 50), vx: rnd(-0.4, 0.4), vy: -1.2, life: 0.3, color: 'rgba(255,214,140,0.9)', size: 2.5 });
      }
      if (S.bullets.length > 400) S.bullets.splice(0, S.bullets.length - 400);
    }
    for (const b of S.bullets) b.z += 1.4 * ds;
    S.bullets = S.bullets.filter((b) => b.z < 1.5);

    // Tore
    for (const g of S.gates) {
      g.z -= S.speed * ds;
      if (!g.used && g.z <= 0.02) {
        g.used = true;
        applyGate(S.wx < 0 ? g.left : g.right);
        if (S.mode !== 'playing') return;
      }
    }
    S.gates = S.gates.filter((g) => g.z > -0.2);

    // Zombies: laufen bis zur Frontlinie, blocken dort und greifen an.
    // Vorbeilaufen gibt es nicht — sie müssen erschossen werden.
    const ZLINE = 0.06;
    for (const z of S.zombies) {
      z.wob += ds * 6;
      if (z.z > ZLINE) {
        z.z -= (S.speed + z.vz) * ds;
        if (z.z < 0.4) {
          const dxw = S.wx - z.wx;
          z.wx += Math.sign(dxw) * Math.min(0.18 * ds, Math.abs(dxw));
        }
        if (z.z < ZLINE) z.z = ZLINE;
      } else {
        const dxw = S.wx - z.wx;
        if (Math.abs(dxw) > 0.01) {
          z.wx += Math.sign(dxw) * Math.min(0.3 * ds, Math.abs(dxw));
        }
        z.atk -= dt;
        if (z.atk <= 0) {
          z.atk = z.boss ? 1100 : 950;
          if (Math.abs(z.wx - S.wx) < z.wr + squadWR()) {
            biteSquad(z);
            if (S.mode !== 'playing') return;
          }
        }
      }
    }

    // Treffer
    for (const b of S.bullets) {
      for (const z of S.zombies) {
        if (z.hp <= 0 || z.z > 1) continue;
        if (Math.abs(b.wx - z.wx) < z.wr * 1.35 && Math.abs(b.z - z.z) < 0.04) {
          z.hp--;
          b.z = 99;
          if (z.hp <= 0) {
            S.kills++;
            killsEl.textContent = 'Kills ' + S.kills;
            burstAt(sx(z.wx, z.z), sy(z.z), '#6e2a22', z.boss ? 22 : 7);
            if (z.boss) {
              floatText(sx(z.wx, z.z), sy(z.z) - 30, 'BOSS ERLEDIGT', '#c9a35a', true);
              S.shake = Math.max(S.shake, 7);
              navigator.vibrate && navigator.vibrate([30, 40, 60]);
            }
          } else {
            S.particles.push({ x: sx(z.wx, z.z), y: sy(z.z) - 10, vx: rnd(-1, 1), vy: -1, life: 0.5, color: 'rgba(255,214,140,0.85)', size: 2.5 });
          }
          break;
        }
      }
    }
    S.zombies = S.zombies.filter((z) => z.hp > 0);
  }

  function stepFx() {
    for (const p of S.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.035; }
    S.particles = S.particles.filter((p) => p.life > 0);
    for (const t of S.texts) { t.y -= 1.1; t.life -= 0.014; }
    S.texts = S.texts.filter((t) => t.life > 0);
    S.pulse *= 0.93;
    S.flash *= 0.92;
    S.shake *= 0.88;
  }

  // ---------- Rendering ----------
  let cloudT = 0;

  function draw() {
    ctx.save();
    if (S.shake > 0.4) ctx.translate(rnd(-1, 1) * S.shake, rnd(-1, 1) * S.shake);

    drawSky();
    drawGround();
    drawRoad();

    // Entities von fern nach nah
    const ents = [];
    for (const g of S.gates) if (g.z <= 1) ents.push({ z: g.z, kind: 'gate', o: g });
    for (const z of S.zombies) if (z.z <= 1) ents.push({ z: z.z, kind: 'zombie', o: z });
    ents.sort((a, b) => b.z - a.z);
    for (const e of ents) {
      if (e.kind === 'gate') drawGate(e.o);
      else drawZombie(e.o);
    }

    // Tracer
    for (const b of S.bullets) {
      if (b.z > 1) continue;
      const p = pf(b.z);
      ctx.strokeStyle = 'rgba(255,214,140,0.85)';
      ctx.lineWidth = Math.max(1, 2.5 * p);
      ctx.beginPath();
      ctx.moveTo(sx(b.wx, b.z), sy(b.z));
      ctx.lineTo(sx(b.wx, b.z + 0.03), sy(b.z + 0.03));
      ctx.stroke();
    }

    if (S.mode !== 'menu') drawSquad();

    // Partikel
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating-Texte
    ctx.textAlign = 'center';
    for (const t of S.texts) {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.font = '900 ' + (t.big ? 34 : 26) + 'px -apple-system, sans-serif';
      ctx.fillStyle = t.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 5;
      ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // Vignette für den düsteren Look
    const vg = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.3, W / 2, H * 0.55, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.32)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Treffer-Flash
    if (S.flash > 0.02) {
      ctx.fillStyle = 'rgba(200,40,30,' + (0.28 * S.flash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawSky() {
    const hy = horizonY();
    // bedeckter Himmel
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, '#4d555e');
    g.addColorStop(0.7, '#737b81');
    g.addColorStop(1, '#8e9295');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hy + 2);
    // Skyline zerstörter Gebäude am Horizont
    ctx.fillStyle = 'rgba(52,57,62,0.85)';
    const bw = W / 14;
    for (let i = 0; i < 14; i++) {
      const bh = 12 + ((i * 53) % 34);
      ctx.fillRect(i * bw, hy - bh, bw - 3, bh + 2);
      if (i % 3 === 0) ctx.fillRect(i * bw + bw * 0.3, hy - bh - 7, bw * 0.25, 8);
    }
    // Rauchsäulen, langsam driftend
    cloudT += 0.0003;
    ctx.fillStyle = 'rgba(58,58,60,0.4)';
    for (let i = 0; i < 2; i++) {
      const cx = W * (0.22 + i * 0.5) + Math.sin(cloudT * 40 + i * 3) * 8;
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.ellipse(cx + k * 6 * (i ? 1 : -1), hy - 14 - k * 16, 14 + k * 7, 9 + k * 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawGround() {
    const hy = horizonY();
    // verbrannte Erde / Schlamm
    const g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, '#56524a');
    g.addColorStop(1, '#6a655a');
    ctx.fillStyle = g;
    ctx.fillRect(0, hy, W, H - hy);
    // Trümmerhaufen in der Ferne
    ctx.fillStyle = '#4c4942';
    ctx.beginPath();
    ctx.ellipse(W * 0.16, hy + 7, W * 0.26, 12, 0, 0, Math.PI * 2);
    ctx.ellipse(W * 0.86, hy + 10, W * 0.3, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function pathAlongRoad(wxA, wxB) {
    // Quad-Streifen entlang der Straße von nah (z=-0.08) bis Horizont
    const steps = 10;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const z = -0.08 + (1.08 * i) / steps;
      const x = sx(wxA, z), y = sy(z);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const z = -0.08 + (1.08 * i) / steps;
      ctx.lineTo(sx(wxB, z), sy(z));
    }
    ctx.closePath();
  }

  function drawRoad() {
    // Asphalt
    const g = ctx.createLinearGradient(0, horizonY(), 0, bottomY());
    g.addColorStop(0, '#3f4246');
    g.addColorStop(1, '#54575c');
    ctx.fillStyle = g;
    pathAlongRoad(-1, 1);
    ctx.fill();
    // abgenutzte Randlinien
    ctx.fillStyle = 'rgba(225,225,215,0.22)';
    pathAlongRoad(-1.0, -0.955);
    ctx.fill();
    pathAlongRoad(0.955, 1.0);
    ctx.fill();
    // Mittelstreifen (scrollend)
    ctx.fillStyle = 'rgba(225,225,215,0.25)';
    for (let z0 = -S.stripeOff; z0 < 1; z0 += 0.09) {
      const z1 = z0, z2 = z0 + 0.04;
      if (z2 < -0.06) continue;
      ctx.beginPath();
      ctx.moveTo(sx(-0.02, z1), sy(z1));
      ctx.lineTo(sx(0.02, z1), sy(z1));
      ctx.lineTo(sx(0.018, z2), sy(z2));
      ctx.lineTo(sx(-0.018, z2), sy(z2));
      ctx.closePath();
      ctx.fill();
    }
    // Straßenrand: Container und Betonbarrieren
    for (let i = 0; i < 8; i++) {
      const z = ((i * 0.15 - S.propOff) % 1.2 + 1.2) % 1.2 - 0.05;
      if (z > 1 || z < -0.05) continue;
      const p = pf(z);
      const x = sx(i % 2 === 0 ? -1.42 : 1.42, z);
      const y = sy(z);
      if (i % 4 < 2) {
        // Schiffscontainer
        const cw = 70 * p, ch = 32 * p;
        ctx.fillStyle = i % 4 === 0 ? '#7d4a2c' : '#5d6b46';
        ctx.fillRect(x - cw / 2, y - ch, cw, ch);
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(x - cw / 2, y - ch, cw, 5 * p);
        ctx.strokeStyle = 'rgba(0,0,0,0.3)';
        ctx.lineWidth = Math.max(0.5, p);
        for (let r = 1; r < 4; r++) {
          ctx.beginPath();
          ctx.moveTo(x - cw / 2 + (cw * r) / 4, y - ch);
          ctx.lineTo(x - cw / 2 + (cw * r) / 4, y);
          ctx.stroke();
        }
      } else {
        // Betonbarriere
        const bw = 42 * p, bh = 16 * p;
        ctx.fillStyle = '#83858a';
        ctx.beginPath();
        ctx.moveTo(x - bw / 2, y);
        ctx.lineTo(x - bw / 2 + 6 * p, y - bh);
        ctx.lineTo(x + bw / 2 - 6 * p, y - bh);
        ctx.lineTo(x + bw / 2, y);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x - bw / 2 + 6 * p, y - bh, bw - 12 * p, 3.5 * p);
      }
    }
  }

  function gateLabel(s) {
    if (s.op === 'x') return '×' + s.val;
    if (s.op === '÷') return '÷' + s.val;
    return (s.op === '+' ? '+' : '−') + s.val;
  }
  const gateGood = (s) => s.op === '+' || s.op === 'x';

  function drawGate(gt) {
    const p = pf(gt.z);
    const y = sy(gt.z);
    const gh = 120 * p;
    const halves = [
      { s: gt.left, a: -1, b: 0 },
      { s: gt.right, a: 0, b: 1 },
    ];
    for (const { s, a, b } of halves) {
      const x1 = sx(a, gt.z), x2 = sx(b, gt.z);
      const good = gateGood(s);
      const alpha = gt.used ? 0.18 : 0.66;
      const grad = ctx.createLinearGradient(0, y - gh, 0, y);
      if (good) {
        grad.addColorStop(0, 'rgba(110,190,150,' + alpha * 0.4 + ')');
        grad.addColorStop(1, 'rgba(40,110,75,' + alpha + ')');
      } else {
        grad.addColorStop(0, 'rgba(205,105,85,' + alpha * 0.4 + ')');
        grad.addColorStop(1, 'rgba(135,40,32,' + alpha + ')');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(x1 + 3 * p, y - gh, x2 - x1 - 6 * p, gh);
      // Rahmen + Pfosten
      ctx.fillStyle = gt.used ? 'rgba(225,228,224,0.2)' : 'rgba(225,228,224,0.7)';
      ctx.fillRect(x1, y - gh, 5 * p, gh);
      ctx.fillRect(x2 - 5 * p, y - gh, 5 * p, gh);
      ctx.fillRect(x1, y - gh - 4 * p, x2 - x1, 5 * p);
      // Label
      ctx.globalAlpha = gt.used ? 0.35 : 1;
      ctx.font = '900 ' + Math.max(13, 46 * p) + 'px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = Math.max(2, 6 * p);
      ctx.strokeText(gateLabel(s), (x1 + x2) / 2, y - gh / 2);
      ctx.fillStyle = 'white';
      ctx.fillText(gateLabel(s), (x1 + x2) / 2, y - gh / 2);
      ctx.globalAlpha = 1;
      ctx.textBaseline = 'alphabetic';
    }
  }

  function drawZombie(z) {
    const p = pf(z.z);
    const x = sx(z.wx, z.z);
    const y = sy(z.z);
    const sc = (z.boss ? 2.6 : 1) * p;
    const lean = Math.sin(z.wob) * 3 * sc;
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(x, y, 14 * sc, 5 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
    // Arme (nach vorn gestreckt, schwingend)
    ctx.strokeStyle = z.boss ? '#39432e' : '#4a583a';
    ctx.lineWidth = 3.5 * sc;
    const swing = Math.sin(z.wob * 2) * 4 * sc;
    ctx.beginPath();
    ctx.moveTo(x - 8 * sc, y - 16 * sc);
    ctx.lineTo(x - 13 * sc, y - 8 * sc + swing);
    ctx.moveTo(x + 8 * sc, y - 16 * sc);
    ctx.lineTo(x + 13 * sc, y - 8 * sc - swing);
    ctx.stroke();
    // Körper (fahle Zombie-Haut, zerrissene Kleidung)
    ctx.fillStyle = z.boss ? '#4a5440' : '#5f6f48';
    ctx.strokeStyle = z.boss ? '#2c331f' : '#3c4a2c';
    ctx.lineWidth = 2 * sc;
    ctx.beginPath();
    ctx.ellipse(x + lean * 0.3, y - 12 * sc, 9 * sc, 12 * sc, lean * 0.02, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Blutfleck
    ctx.fillStyle = 'rgba(110,42,34,0.8)';
    ctx.beginPath();
    ctx.ellipse(x + lean * 0.3 - 3 * sc, y - 9 * sc, 3.2 * sc, 4 * sc, 0.4, 0, Math.PI * 2);
    ctx.fill();
    // Kopf
    ctx.fillStyle = z.boss ? '#5c6a4a' : '#74845a';
    ctx.strokeStyle = z.boss ? '#2c331f' : '#3c4a2c';
    ctx.beginPath();
    ctx.arc(x + lean * 0.5, y - 27 * sc, 5.5 * sc, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Augen
    ctx.fillStyle = z.boss ? '#e05d50' : '#d9d4b0';
    ctx.beginPath();
    ctx.arc(x + lean * 0.5 - 2 * sc, y - 28 * sc, 1.3 * sc, 0, Math.PI * 2);
    ctx.arc(x + lean * 0.5 + 2 * sc, y - 28 * sc, 1.3 * sc, 0, Math.PI * 2);
    ctx.fill();
    // Boss-HP
    if (z.boss) {
      const w = 60 * sc;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(x - w / 2, y - 42 * sc, w, 6 * sc);
      ctx.fillStyle = '#9fdc7a';
      ctx.fillRect(x - w / 2, y - 42 * sc, w * (z.hp / z.maxHp), 6 * sc);
    }
  }

  // Formation: goldener Spiral-Offset, hinten zuerst gezeichnet
  const formation = [];
  for (let i = 0; i < 50; i++) {
    const r = 6.4 * Math.sqrt(i);
    const a = i * GOLD;
    formation.push({ ox: Math.cos(a) * r, oy: Math.sin(a) * r * 0.62 });
  }
  const formationOrder = formation.map((_, i) => i).sort((a, b) => formation[a].oy - formation[b].oy);

  function drawSoldier(x, y, t, i) {
    const step = Math.sin(t / 90 + i * 1.7) * 1.6;
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y + 7, 7, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Beine
    ctx.strokeStyle = '#2c3136';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 2.5, y);
    ctx.lineTo(x - 2.5, y + 6 + step * 0.5);
    ctx.moveTo(x + 2.5, y);
    ctx.lineTo(x + 2.5, y + 6 - step * 0.5);
    ctx.stroke();
    // Körper (taktische Weste)
    ctx.fillStyle = '#41506b';
    ctx.strokeStyle = '#262f42';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y - 4 + step * 0.3, 5.2, 6.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Waffe (nach vorn / oben)
    ctx.strokeStyle = '#1d1d1d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 4, y - 6);
    ctx.lineTo(x + 6.5, y - 13);
    ctx.stroke();
    // Kopf + Helm
    ctx.fillStyle = '#e8bd92';
    ctx.beginPath();
    ctx.arc(x, y - 12 + step * 0.3, 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#33415c';
    ctx.beginPath();
    ctx.arc(x, y - 13 + step * 0.3, 3.6, Math.PI, 0);
    ctx.fill();
  }

  function drawSquad() {
    const cx = sx(S.wx, 0);
    const cy = bottomY() - 16;
    const t = performance.now();
    const n = Math.min(S.count, 50);
    const scale = 1 + 0.16 * S.pulse;
    for (const i of formationOrder) {
      if (i >= n) continue;
      const f = formation[i];
      drawSoldier(cx + f.ox * scale, cy + f.oy * scale, t, i);
    }
    // Truppenstärke
    ctx.textAlign = 'center';
    ctx.font = '900 ' + Math.round(26 * scale) + 'px -apple-system, sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 6;
    const label = '' + S.count;
    const ly = cy - 58 - 6.4 * Math.sqrt(n) * 0.62;
    ctx.strokeText(label, cx, ly);
    ctx.fillStyle = 'white';
    ctx.fillText(label, cx, ly);
  }

  function loop(t) {
    const dt = Math.min(50, t - S.last);
    S.last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  let dragging = false, lastX = 0;
  function down(x) { dragging = true; lastX = x; }
  function move(x) {
    if (!dragging || S.mode !== 'playing') { lastX = x; return; }
    S.wx = Math.min(Math.max(S.wx + ((x - lastX) / rh(0)) * 1.5, -0.84), 0.84);
    lastX = x;
  }
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); down(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchend', () => { dragging = false; });
  canvas.addEventListener('mousedown', (e) => down(e.clientX));
  canvas.addEventListener('mousemove', (e) => move(e.clientX));
  canvas.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('keydown', (e) => {
    if (S.mode !== 'playing') return;
    if (e.code === 'ArrowLeft') S.wx = Math.max(-0.84, S.wx - 0.09);
    if (e.code === 'ArrowRight') S.wx = Math.min(0.84, S.wx + 0.09);
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  S.last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
