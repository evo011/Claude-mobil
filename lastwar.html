<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3d3a2e">
<title>Last Tap: Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #c9bd9c;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  #back {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 16px;
    z-index: 5;
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    padding: 8px;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 16px);
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    color: white;
    text-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }
  #meters {
    font-size: 34px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  #kills {
    font-size: 15px;
    font-weight: 700;
    opacity: 0.9;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    padding: 20px;
  }
  .panel {
    pointer-events: auto;
    background: rgba(30,32,24,0.78);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px;
    padding: 32px 36px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    max-width: 330px;
  }
  .panel h1 {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 10px;
  }
  .panel p {
    font-size: 16px;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 22px;
    line-height: 1.45;
  }
  .stats {
    display: flex;
    gap: 22px;
    justify-content: center;
    margin: 4px 0 22px;
  }
  .stat .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .stat .value {
    font-size: 30px;
    font-weight: 900;
  }
  .record { color: #ffd64d; font-weight: 800; margin-bottom: 18px; }
  button {
    background: #ffd64d;
    border: none;
    color: #533;
    font-size: 18px;
    font-weight: 800;
    padding: 14px 32px;
    border-radius: 20px;
    box-shadow: 0 4px 0 #c9a030, 0 6px 16px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    font-family: inherit;
  }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c9a030, 0 2px 8px rgba(0,0,0,0.3);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">‹ Arcade</a>
<div id="hud" class="hidden">
  <div id="meters">0 m</div>
  <div id="kills">☠️ 0</div>
</div>
<div id="ui">
  <div id="start" class="panel">
    <h1>🪖 Last Tap: Survival</h1>
    <p>Zieh deine Squad mit dem Finger nach links und rechts. Nimm die <b>grünen Tore</b> (+/×) mit, meide die roten — und halte die Zombie-Horde auf!</p>
    <button id="startBtn">Ausrücken</button>
  </div>
  <div id="over" class="panel hidden">
    <h1>💀 Überrannt!</h1>
    <div class="stats">
      <div class="stat"><div class="label">Distanz</div><div class="value" id="finalMeters">0</div></div>
      <div class="stat"><div class="label">Kills</div><div class="value" id="finalKills">0</div></div>
    </div>
    <div class="record" id="recordLine"></div>
    <button id="retryBtn">Neuer Versuch</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const metersEl = document.getElementById('meters');
  const killsEl = document.getElementById('kills');
  const startPanel = document.getElementById('start');
  const overPanel = document.getElementById('over');
  const finalMeters = document.getElementById('finalMeters');
  const finalKills = document.getElementById('finalKills');
  const recordLine = document.getElementById('recordLine');

  let W = 0, H = 0, DPR = 1;
  const GOLD = Math.PI * (3 - Math.sqrt(5));

  const S = {
    mode: 'menu', // menu | playing | over
    squadX: 0,
    count: 1,
    meters: 0,
    kills: 0,
    speed: 2.4,
    gates: [],
    zombies: [],
    bullets: [],
    particles: [],
    texts: [],
    fireAcc: 0,
    gateTimer: 0,
    waveTimer: 0,
    bossAt: 400,
    last: 0,
    best: +(localStorage.getItem('lastwar_best') || 0),
  };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S.squadX = Math.min(Math.max(S.squadX || W / 2, 40), W - 40);
  }

  const squadY = () => H * 0.78;
  const squadRadius = () => 10 + 5.2 * Math.sqrt(Math.min(S.count, 60));

  function soldierPos(i) {
    const r = 5.2 * Math.sqrt(i);
    const a = i * GOLD;
    return { x: Math.cos(a) * r, y: Math.sin(a) * r };
  }

  function reset() {
    S.count = 1;
    S.meters = 0;
    S.kills = 0;
    S.speed = 2.4;
    S.gates = [];
    S.zombies = [];
    S.bullets = [];
    S.particles = [];
    S.texts = [];
    S.fireAcc = 0;
    S.gateTimer = 1200;
    S.waveTimer = 2600;
    S.bossAt = 400;
    S.squadX = W / 2;
    metersEl.textContent = '0 m';
    killsEl.textContent = '☠️ 0';
  }

  function startGame() {
    reset();
    S.mode = 'playing';
    startPanel.classList.add('hidden');
    overPanel.classList.add('hidden');
    hud.classList.remove('hidden');
  }

  function gameOver() {
    S.mode = 'over';
    burst(S.squadX, squadY(), '#4d79ff', 30);
    navigator.vibrate && navigator.vibrate([80, 50, 120]);
    const score = Math.floor(S.meters);
    let rec = '';
    if (score > S.best) {
      S.best = score;
      localStorage.setItem('lastwar_best', score);
      rec = '🏆 Neuer Rekord!';
    } else {
      rec = '🏆 Rekord: ' + S.best + ' m';
    }
    setTimeout(() => {
      finalMeters.textContent = score + ' m';
      finalKills.textContent = S.kills;
      recordLine.textContent = rec;
      hud.classList.add('hidden');
      overPanel.classList.remove('hidden');
    }, 600);
  }

  // ---------- Spawning ----------
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function ri(a, b) { return Math.floor(rnd(a, b + 1)); }

  function goodOp() {
    if (Math.random() < 0.22) return { op: 'x', val: Math.random() < 0.2 ? 3 : 2 };
    return { op: '+', val: ri(3, 8 + Math.floor(S.meters / 25)) };
  }
  function badOp() {
    if (Math.random() < 0.3) return { op: '÷', val: 2 };
    return { op: '-', val: ri(4, 8 + Math.floor(S.meters / 35)) };
  }

  function spawnGate() {
    const a = goodOp();
    const b = Math.random() < 0.65 ? badOp() : goodOp();
    const flip = Math.random() < 0.5;
    S.gates.push({
      y: -60,
      left: flip ? b : a,
      right: flip ? a : b,
      used: false,
    });
  }

  function spawnWave(big) {
    const n = Math.min(34, ri(3, 6) + Math.floor(S.meters / 50)) * (big ? 2 : 1);
    const cx = rnd(W * 0.2, W * 0.8);
    const hp = 1 + Math.floor(S.meters / 160);
    for (let i = 0; i < n; i++) {
      S.zombies.push({
        x: Math.min(Math.max(cx + rnd(-W * 0.22, W * 0.22), 16), W - 16),
        y: rnd(-220, -30),
        r: 11,
        hp: hp,
        maxHp: hp,
        sp: rnd(0.25, 0.7),
        wob: Math.random() * Math.PI * 2,
        boss: false,
      });
    }
  }

  function spawnBoss() {
    const hp = 25 + Math.floor(S.meters / 8);
    S.zombies.push({
      x: rnd(W * 0.3, W * 0.7),
      y: -90,
      r: 34,
      hp: hp,
      maxHp: hp,
      sp: 0.35,
      wob: 0,
      boss: true,
    });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 4;
      S.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, size: 2 + Math.random() * 4 });
    }
  }

  function floatText(x, y, txt, color) {
    S.texts.push({ x, y, txt, color, life: 1 });
  }

  // ---------- Gameplay ----------
  function applyGate(side) {
    const c0 = S.count;
    if (side.op === '+') S.count += side.val;
    if (side.op === '-') S.count -= side.val;
    if (side.op === 'x') S.count *= side.val;
    if (side.op === '÷') S.count = Math.ceil(S.count / side.val);
    S.count = Math.min(S.count, 999);
    const diff = S.count - c0;
    const good = diff >= 0;
    floatText(S.squadX, squadY() - squadRadius() - 24, (good ? '+' : '') + diff, good ? '#7dff7d' : '#ff6b6b');
    burst(S.squadX, squadY(), good ? '#7dff7d' : '#ff6b6b', 12);
    navigator.vibrate && navigator.vibrate(good ? 15 : [40, 30, 40]);
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  function hitSquad(z) {
    const dmg = z.boss ? 8 + Math.ceil(z.hp / 4) : 1;
    S.count -= dmg;
    floatText(z.x, squadY() - squadRadius() - 16, '-' + dmg, '#ff6b6b');
    burst(z.x, squadY() - squadRadius(), '#ff6b6b', z.boss ? 18 : 6);
    navigator.vibrate && navigator.vibrate(z.boss ? [60, 40, 60] : 25);
    z.hp = 0;
    if (S.count <= 0) { S.count = 0; gameOver(); }
  }

  function update(dt) {
    if (S.mode !== 'playing') {
      // Partikel/Texte auch im Game-Over-Moment weiterlaufen lassen
      stepFx();
      return;
    }

    S.speed = Math.min(5, 2.4 + S.meters / 250);
    S.meters += S.speed * dt / 55;
    metersEl.textContent = Math.floor(S.meters) + ' m';

    // Tore
    S.gateTimer -= dt;
    if (S.gateTimer <= 0) {
      spawnGate();
      S.gateTimer = rnd(3200, 4600) / (0.8 + S.speed / 6);
    }
    // Zombie-Wellen
    S.waveTimer -= dt;
    if (S.waveTimer <= 0) {
      spawnWave(Math.random() < 0.18);
      S.waveTimer = rnd(1500, 2600) / (0.7 + S.speed / 5);
    }
    // Boss
    if (S.meters >= S.bossAt) {
      spawnBoss();
      S.bossAt += 400;
    }

    // Auto-Feuer: Feuerrate wächst mit der Squad
    const rate = Math.min(26, 3.5 + S.count * 0.45);
    S.fireAcc += dt;
    const interval = 1000 / rate;
    while (S.fireAcc >= interval) {
      S.fireAcc -= interval;
      const idx = ri(0, Math.min(S.count, 60) - 1);
      const p = soldierPos(idx);
      S.bullets.push({ x: S.squadX + p.x, y: squadY() + p.y - 8, vx: rnd(-0.5, 0.5), vy: -11 });
      if (S.bullets.length > 220) S.bullets.shift();
    }

    // Kugeln
    for (const b of S.bullets) { b.x += b.vx; b.y += b.vy; }
    S.bullets = S.bullets.filter(b => b.y > -20);

    // Tore bewegen + auslösen
    for (const g of S.gates) {
      g.y += S.speed;
      if (!g.used && g.y >= squadY() - squadRadius()) {
        g.used = true;
        applyGate(S.squadX < W / 2 ? g.left : g.right);
        if (S.mode !== 'playing') return;
      }
    }
    S.gates = S.gates.filter(g => g.y < H + 80);

    // Zombies
    for (const z of S.zombies) {
      z.y += S.speed + z.sp;
      z.wob += dt / 180;
      z.x += Math.sin(z.wob) * 0.4;
      // leichtes Zusteuern auf die Squad, wenn nah
      if (z.y > H * 0.45) z.x += Math.sign(S.squadX - z.x) * (z.boss ? 0.5 : 0.9);
      // Kontakt mit Squad
      const dx = z.x - S.squadX, dy = z.y - squadY();
      if (z.hp > 0 && Math.hypot(dx, dy) < z.r + squadRadius() * 0.7) {
        hitSquad(z);
        if (S.mode !== 'playing') return;
      }
    }

    // Kugel-Treffer
    for (const b of S.bullets) {
      for (const z of S.zombies) {
        if (z.hp <= 0) continue;
        if (Math.abs(b.x - z.x) < z.r + 3 && Math.abs(b.y - z.y) < z.r + 5) {
          z.hp--;
          b.y = -999;
          if (z.hp <= 0) {
            S.kills++;
            killsEl.textContent = '☠️ ' + S.kills;
            burst(z.x, z.y, z.boss ? '#c06bff' : '#ff5252', z.boss ? 26 : 7);
            if (z.boss) {
              floatText(z.x, z.y, 'BOSS DOWN!', '#ffd64d');
              navigator.vibrate && navigator.vibrate([30, 40, 60]);
            }
          } else {
            S.particles.push({ x: b.x, y: z.y + z.r * 0.5, vx: rnd(-1, 1), vy: -1, life: 0.5, color: '#ffe08a', size: 2.5 });
          }
          break;
        }
      }
    }
    S.zombies = S.zombies.filter(z => z.hp > 0 && z.y < H + 60);

    stepFx();
  }

  function stepFx() {
    for (const p of S.particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.035; }
    S.particles = S.particles.filter(p => p.life > 0);
    for (const t of S.texts) { t.y -= 1.1; t.life -= 0.016; }
    S.texts = S.texts.filter(t => t.life > 0);
  }

  // ---------- Rendering ----------
  let roadOffset = 0;

  function draw() {
    // Boden: Wüstenpiste
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#b5ab87');
    g.addColorStop(1, '#cfc4a0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Fahrbahn-Streifen scrollen
    if (S.mode === 'playing') roadOffset = (roadOffset + S.speed) % 90;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let y = -90 + roadOffset; y < H; y += 90) {
      ctx.fillRect(W / 2 - 4, y, 8, 44);
    }
    ctx.fillStyle = 'rgba(90,80,55,0.25)';
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);

    // Tore
    for (const gt of S.gates) drawGate(gt);

    // Kugeln
    ctx.fillStyle = '#ffe08a';
    for (const b of S.bullets) {
      ctx.fillRect(b.x - 1.5, b.y - 6, 3, 9);
    }

    // Zombies
    for (const z of S.zombies) drawZombie(z);

    // Squad
    if (S.mode !== 'menu') drawSquad();

    // Partikel
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating-Texte
    ctx.textAlign = 'center';
    for (const t of S.texts) {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.font = '900 26px -apple-system, sans-serif';
      ctx.fillStyle = t.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 4;
      ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  function gateLabel(s) {
    if (s.op === 'x') return '×' + s.val;
    if (s.op === '÷') return '÷' + s.val;
    return (s.op === '+' ? '+' : '−') + s.val;
  }
  function gateGood(s) { return s.op === '+' || s.op === 'x'; }

  function drawGate(gt) {
    const h = 52;
    const halves = [
      { s: gt.left, x: 0 },
      { s: gt.right, x: W / 2 },
    ];
    for (const { s, x } of halves) {
      const good = gateGood(s);
      ctx.globalAlpha = gt.used ? 0.25 : 0.82;
      ctx.fillStyle = good ? 'rgba(60,180,90,0.85)' : 'rgba(210,60,60,0.85)';
      ctx.fillRect(x + 6, gt.y - h / 2, W / 2 - 12, h);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 6, gt.y - h / 2, W / 2 - 12, h);
      ctx.fillStyle = 'white';
      ctx.font = '900 30px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(gateLabel(s), x + W / 4, gt.y + 1);
      ctx.textBaseline = 'alphabetic';
    }
    ctx.globalAlpha = 1;
  }

  function drawZombie(z) {
    const bob = Math.sin(z.wob * 3) * 2;
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(z.x, z.y + z.r * 0.85, z.r * 0.9, z.r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    // Körper
    ctx.fillStyle = z.boss ? '#8a3fc4' : '#d83a3a';
    ctx.strokeStyle = z.boss ? '#5e2687' : '#8f1d1d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(z.x, z.y + bob, z.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Augen
    ctx.fillStyle = '#ffe9a8';
    const er = z.r * 0.16;
    ctx.beginPath();
    ctx.arc(z.x - z.r * 0.3, z.y + bob - z.r * 0.15, er, 0, Math.PI * 2);
    ctx.arc(z.x + z.r * 0.3, z.y + bob - z.r * 0.15, er, 0, Math.PI * 2);
    ctx.fill();
    // Boss-HP-Balken
    if (z.boss) {
      const w = z.r * 2.2;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(z.x - w / 2, z.y - z.r - 14, w, 7);
      ctx.fillStyle = '#7dff7d';
      ctx.fillRect(z.x - w / 2, z.y - z.r - 14, w * (z.hp / z.maxHp), 7);
    }
  }

  function drawSquad() {
    const sy = squadY();
    const n = Math.min(S.count, 60);
    // Schatten
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(S.squadX, sy + 6, squadRadius() * 0.95, squadRadius() * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    const t = performance.now();
    for (let i = n - 1; i >= 0; i--) {
      const p = soldierPos(i);
      const jig = Math.sin(t / 90 + i) * 1.2;
      const x = S.squadX + p.x;
      const y = sy + p.y * 0.8 + jig;
      // Körper
      ctx.fillStyle = '#3d6ddb';
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      // Helm
      ctx.fillStyle = '#274a9e';
      ctx.beginPath();
      ctx.arc(x, y - 2.5, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Anzahl über der Squad
    ctx.textAlign = 'center';
    ctx.font = '900 24px -apple-system, sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 5;
    ctx.fillStyle = 'white';
    const label = '' + S.count;
    const ly = sy - squadRadius() * 0.8 - 14;
    ctx.strokeText(label, S.squadX, ly);
    ctx.fillText(label, S.squadX, ly);
  }

  function loop(t) {
    const dt = Math.min(50, t - S.last);
    S.last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  let dragging = false, lastX = 0;
  function down(x) { dragging = true; lastX = x; }
  function move(x) {
    if (!dragging || S.mode !== 'playing') { lastX = x; return; }
    S.squadX = Math.min(Math.max(S.squadX + (x - lastX) * 1.25, 30), W - 30);
    lastX = x;
  }
  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); down(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); move(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchend', () => { dragging = false; });
  canvas.addEventListener('mousedown', (e) => down(e.clientX));
  canvas.addEventListener('mousemove', (e) => move(e.clientX));
  canvas.addEventListener('mouseup', () => { dragging = false; });
  document.addEventListener('keydown', (e) => {
    if (S.mode !== 'playing') return;
    if (e.code === 'ArrowLeft') S.squadX = Math.max(30, S.squadX - 28);
    if (e.code === 'ArrowRight') S.squadX = Math.min(W - 30, S.squadX + 28);
  });
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  resize();
  S.last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
