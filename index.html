<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1033">
<title>Mini-Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; min-height: 100%;
    background: #1a1033;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: white;
  }
  body {
    background: linear-gradient(160deg, #1a1033 0%, #2d1a5e 50%, #1a1033 100%);
    padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  #stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  header {
    text-align: center;
    margin-bottom: 36px;
    z-index: 1;
  }
  h1 {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #ffd64d, #ff6b9d, #6be5ff, #ffd64d);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 300% 0; }
  }
  header p {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 600;
    opacity: 0.7;
  }
  .games {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 420px;
    z-index: 1;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 20px 22px;
    text-decoration: none;
    color: white;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    transition: transform 0.12s, box-shadow 0.12s;
    animation: floatIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
  }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.25s; }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:active {
    transform: scale(0.97);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  .card .emoji {
    font-size: 44px;
    line-height: 1;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    flex-shrink: 0;
  }
  .card.flappy .emoji { background: linear-gradient(135deg, #70c5ce, #4a9fb8); }
  .card.memory .emoji { background: linear-gradient(135deg, #ff6b9d, #c84b7f); }
  .card.reaction .emoji { background: linear-gradient(135deg, #6be5ff, #3a8fd9); }
  .card .info { flex: 1; min-width: 0; }
  .card h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 3px;
  }
  .card p {
    font-size: 14px;
    font-weight: 500;
    opacity: 0.65;
  }
  .card .best {
    font-size: 13px;
    font-weight: 700;
    color: #ffd64d;
    margin-top: 5px;
  }
  .card .arrow {
    font-size: 22px;
    opacity: 0.4;
    flex-shrink: 0;
  }
  footer {
    margin-top: auto;
    padding-top: 40px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0.4;
    text-align: center;
    z-index: 1;
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<header>
  <h1>Mini-Arcade</h1>
  <p>Drei kleine Spiele. Null Ladezeit. Viel Spaß.</p>
</header>
<div class="games">
  <a class="card flappy" href="flappy.html">
    <div class="emoji">🐤</div>
    <div class="info">
      <h2>Flappy Tap</h2>
      <p>Tippe und weich den Rohren aus</p>
      <div class="best" id="bestFlappy"></div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="card memory" href="memory.html">
    <div class="emoji">🧠</div>
    <div class="info">
      <h2>Emoji-Memory</h2>
      <p>Finde alle Paare — so schnell du kannst</p>
      <div class="best" id="bestMemory"></div>
    </div>
    <div class="arrow">›</div>
  </a>
  <a class="card reaction" href="reaction.html">
    <div class="emoji">⚡️</div>
    <div class="info">
      <h2>Blitz-Reaktion</h2>
      <p>Wie schnell sind deine Finger wirklich?</p>
      <div class="best" id="bestReaction"></div>
    </div>
    <div class="arrow">›</div>
  </a>
</div>
<footer>Tipp: Über „Zum Home-Bildschirm" in Safari wird daraus eine App.</footer>
<script>
(() => {
  // High-Scores der Spiele auf den Karten anzeigen
  const flappy = localStorage.getItem('flappy_best');
  if (flappy && +flappy > 0) {
    document.getElementById('bestFlappy').textContent = '🏆 Best: ' + flappy;
  }
  const memory = localStorage.getItem('memory_best_ms');
  if (memory) {
    document.getElementById('bestMemory').textContent = '🏆 Best: ' + (memory / 1000).toFixed(1) + 's';
  }
  const reaction = localStorage.getItem('reaction_best_ms');
  if (reaction) {
    document.getElementById('bestReaction').textContent = '🏆 Best: ' + reaction + ' ms';
  }

  // Funkelnder Sternenhimmel
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * DPR;
    canvas.height = window.innerHeight * DPR;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 0.5 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.5 + Math.random() * 1.5,
    }));
  }

  function draw(t) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (const s of stars) {
      const a = 0.25 + 0.6 * (0.5 + Math.sin(t / 1000 * s.speed + s.phase) / 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
